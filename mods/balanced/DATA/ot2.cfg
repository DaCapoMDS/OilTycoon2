// Balanced: keeps the things you look at, drops the things that cost passes.
//
// 85% of the frame is one CPU transform loop in Renderer.dll, re-run for
// every render pass and every object. No single setting removes it - each
// one only removes a slice - so this spends the budget deliberately:
//
//   kept    trees, cars, particles, full texture detail
//           (these are what the game looks like)
//   dropped reflections, shadows, water refraction
//           (each is a whole extra scene pass through that loop)
//   reduced citydistance, the single biggest measured lever at ~10 fps
//
// Measured points for reference: everything on ~10 fps, everything off
// ~50 fps, citydistance alone 50 -> 40 fps.

vid_colorbits   32
vid_fullscreen  0
vid_width       1440
vid_height      1080

// extra scene passes - the expensive ones
reflections             0
cityreflectiondistance  0
shadows                 0
cityshadowdistance      0
water                   0

// object count - the biggest single lever
citydistance    70

// keep the look
drawtrees         1
treeloddist       45
treemaxdist       120
treepatchmaxdist  120
treeblendstart    90
drawcars          1
drawwaves         0
particles         1
texturedetail     2

drawfps 1
