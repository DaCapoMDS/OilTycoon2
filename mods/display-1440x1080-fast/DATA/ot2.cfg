// 1440x1080, reflections and shadows off, FPS counter on.
//
// reflections 0 and shadows 0 are the two settings that showed up as
// expensive when measured. Treat the size of the win as unproven: the camera
// sits wherever the last session left it, so no two launches render the same
// scene, and the same settings produced 33 ms in one run and 66 ms in
// another. Park the camera somewhere, then swap between this and
// display-1440x1080 to judge it properly.
//
// Everything else stays on: trees, water, particles, cars, waves, full
// texture detail and draw distance.

vid_colorbits   32
vid_fullscreen  0
vid_width       1440
vid_height      1080

reflections             0
cityreflectiondistance  0
shadows                 0
cityshadowdistance      0

water           2
particles       1
texturedetail   2
citydistance    135

drawtrees         1
treeloddist       57
treemaxdist       175
treepatchmaxdist  175
treeblendstart    115

drawcars          1
drawwaves         1

// drawfps also enables the large profiler overlay, which is not free - it
// adds ~31 CPU/GPU sync points per frame. Set to 0 if you want it gone.
drawfps 1
