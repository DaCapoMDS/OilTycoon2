// 1440x1080, reflections and shadows off.
// Measured: 33 ms/frame and 0 queue syncs, vs 90-106 ms and 41 syncs stock.

vid_colorbits   32
vid_fullscreen  0
vid_width       1440
vid_height      1080

// the fix: reflections re-render the scene per reflective surface and wait
// on each, stalling the CPU on the GPU ~41 times a frame
reflections             0
cityreflectiondistance  0

// no stalls, but ~26 ms of render cost
shadows                 0
cityshadowdistance      0

// everything below stays on
water           2
particles       1
texturedetail   2
citydistance    135

drawtrees         1
treeloddist       57
treemaxdist       175
treepatchmaxdist  175
treeblendstart    115

drawcars          1
drawwaves         1

drawfps 1
