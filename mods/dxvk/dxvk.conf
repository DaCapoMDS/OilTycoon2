# DXVK tuning for Oil Tycoon 2.
#
# The HUD showed the real problem: ~41 queue syncs per frame against 54
# submissions, with GPU load at 9% and 3,579 draw calls. Draw call count is
# unremarkable and the GPU is asleep - the cost is the CPU stopping dead to
# wait for the GPU, over and over, every frame. That is what a 2006 engine
# does when it locks a dynamic vertex buffer the GPU is still reading,
# without discard semantics. Modern drivers cannot paper over it.
#
# Both settings below attack that, by putting buffers where a lock does not
# have to wait on the GPU at all.

# Allocate dynamic resources in cached system memory. Removes the stall when
# the game locks a dynamic buffer that is still in flight.
d3d9.cachedDynamicBuffers = True

# Map every buffer in cached memory, not only the dynamic ones. A heavier
# hammer than the above and named for apitrace, but it is the setting that
# removes lock-induced synchronisation in the general case - which is what
# 41 syncs a frame calls for.
d3d9.apitraceMode = True

# Managed textures normally get evicted from video memory on unlock, which
# means re-uploading them later. This game has 113 MB resident against a
# 224 MB heap, so there is ample room to simply keep them.
d3d9.evictManagedOnUnlock = False
