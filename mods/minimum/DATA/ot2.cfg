// Baseline + citydistance 135 (40 fps) + ONE change: water back to 2.
//
// Why water is the suspect: the terrain ships a dedicated refraction model
// set - default.cfg lists terr_lod_N_refract alongside ground and reflect -
// and the object XML carries refraction="true". So water tier 2 renders the
// scene again for refraction, and the `reflections` variable does not turn
// that off. Which would explain why setting reflections 0 never helped.

vid_colorbits   32
vid_fullscreen  0
vid_width       1440
vid_height      1080

reflections             0
cityreflectiondistance  0
shadows                 0
cityshadowdistance      0

water           2

particles       0
texturedetail   2
citydistance    135

drawtrees         0
treeloddist       20
treemaxdist       40
treepatchmaxdist  40
treeblendstart    30

drawcars        0
drawwaves       0

drawfps         1
