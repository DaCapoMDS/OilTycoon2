// Diagnostic config - every expensive pass off, resolution unchanged.
// A/B this against your normal settings to find out whether 20 fps in a
// round is the renderer or the simulation.

vid_colorbits   32
vid_fullscreen  1
vid_width       1920
vid_height      1080

// the extra scene passes
reflections     0
shadows         0
water           0
particles       0

// how much gets drawn at all
citydistance            60
cityreflectiondistance  0
cityshadowdistance      0

// trees are drawn as a separate batched pass
drawtrees         0
treeloddist       20
treemaxdist       40
treepatchmaxdist  40
treeblendstart    30

drawcars        0
drawwaves       0
texturedetail   2

// leave the counter on so the comparison is readable
drawfps 1
